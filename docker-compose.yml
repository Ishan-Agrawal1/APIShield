services:
  mongo:
    image: mongo:7
    container_name: apishield-vulnerable-mongo
    ports:
      - "27017:27017"
    volumes:
      - vulnerable_api_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vulnerable-api:
    build:
      context: ./vulnerable-api
      dockerfile: Dockerfile
    container_name: apishield-vulnerable-api
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/vulnerable-api
      JWT_SECRET: lab-only-not-a-real-secret
      JWT_EXPIRES_IN: 24h
      LOG_FILE: logs/http-events.jsonl
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  vulnerable_api_mongo_data:
