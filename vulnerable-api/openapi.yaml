openapi: 3.0.3
info:
  title: Vulnerable API Lab
  description: |
    Intentionally vulnerable Notes API used as a local test target for APIShield.

    This specification describes the **declared** API inventory. Additional
    versioned and debug endpoints exist at runtime and are omitted here on
    purpose so later inventory analysis can compare declared versus observed
    paths.

    Authentication works for the documented Notes operations. Object-level
    authorization on `GET`/`PATCH /api/notes/{id}` is intentionally missing.
  version: 1.0.0
  contact:
    name: APIShield Team

servers:
  - url: http://localhost:5001
    description: Local vulnerable-api lab

tags:
  - name: Authentication
  - name: Users
  - name: Notes

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: newuser@test.com
              password: password123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user1@test.com
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                userId: 1
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users:
    get:
      tags: [Users]
      summary: List users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list without passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicUser'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user by id
      description: Authenticated users may view their own record. Admins may view any user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the user and is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notes:
    get:
      tags: [Notes]
      summary: List the authenticated user's notes
      description: |
        Accepts `limit` without rejecting excessively large values. That
        acceptance is intentional for later resource-consumption analysis.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
          description: Requested maximum number of notes. Large values are accepted.
          example: 20
      responses:
        '200':
          description: Notes owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        '400':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Notes]
      summary: Create a note for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
            example:
              title: Shopping list
              content: Milk and bread
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Missing title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notes/{id}:
    get:
      tags: [Notes]
      summary: Get a note by id
      description: |
        A secure API would return 403 when the note belongs to another user.
        This target authenticates the request but does not enforce ownership.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Note record, including userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Note not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Notes]
      summary: Update a note by id
      description: |
        A secure API would return 403 when the note belongs to another user.
        This target authenticates the request but does not enforce ownership.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
            example:
              title: Modified by User 1
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Invalid update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Note not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Notes]
      summary: Delete a note owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Note deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteNoteResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not own the note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Note not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /auth/login or POST /auth/register

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    NoteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user1@test.com
        password:
          type: string
          format: password
          example: password123
    AuthResponse:
      type: object
      required: [token, userId]
      properties:
        token:
          type: string
        userId:
          type: integer
          example: 1
    PublicUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user1@test.com
        role:
          type: string
          enum: [user, admin]
    Note:
      type: object
      required: [id, userId, title, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        title:
          type: string
          example: User 1 Note
        content:
          type: string
          example: Private note belonging to User 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteListResponse:
      type: object
      required: [notes, count, accepted]
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        count:
          type: integer
        limit:
          type: number
          nullable: true
        accepted:
          type: boolean
        internalFetchCap:
          type: integer
    CreateNoteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string
    UpdateNoteRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
    DeleteNoteResponse:
      type: object
      properties:
        deleted:
          type: boolean
        id:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

security:
  - bearerAuth: []
