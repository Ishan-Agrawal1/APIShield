openapi: 3.0.3
info:
  title: Vulnerable API Lab
  description: |
    REST API for APIShield testing.
    
    **NOTE**: This spec is INTENTIONALLY INCOMPLETE.
    The actual API exposes additional undocumented endpoints 
    that are not listed here. This is used to test 
    API9:2023 — Improper Inventory Management.
  version: 1.0.0
  contact:
    name: APIShield Team

servers:
  - url: http://localhost:5001
    description: Local development server

paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: userA@test.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/SafeUser'
        '401':
          description: Invalid credentials

  /api/users:
    get:
      tags:
        - Users
      summary: List all users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SafeUser'
        '401':
          description: Unauthorized

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/products:
    get:
      tags:
        - Products
      summary: List all products
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags:
        - Products
      summary: Create a product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                price:
                  type: number
                description:
                  type: string
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized

  # ─────────────────────────────────────────────────────
  # INTENTIONALLY OMITTED endpoints (for V05 testing):
  #   GET /api/admin/users     — Admin panel
  #   GET /api/v1/users        — Legacy versioned alias
  #   GET /api/v1/users/:id    — Legacy versioned alias
  #   GET /api/admin-old       — Deprecated legacy endpoint
  #   GET /api/health          — Health check
  # ─────────────────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SafeUser:
      type: object
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: User A
        email:
          type: string
          format: email
          example: userA@test.com
        role:
          type: string
          enum: [user, admin]
          example: user

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Widget
        price:
          type: number
          example: 9.99
        description:
          type: string
          example: A basic widget
        createdBy:
          type: integer
          example: 101
