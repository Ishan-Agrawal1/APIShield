services:
  mongo:
    image: mongo:7
    container_name: apishield-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - apishield_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vulnerable-api:
    build:
      context: ./vulnerable-api
      dockerfile: Dockerfile
    container_name: apishield-vulnerable-api
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      PORT: 5001
      BIND_HOST: 0.0.0.0
      NODE_ENV: development
      APP_MODE: vulnerable
      MONGO_URI: mongodb://mongo:27017/vulnerable-api
      JWT_SECRET: lab-only-not-a-real-secret
      JWT_EXPIRES_IN: 24h
      LOG_FILE: logs/http-events.jsonl
      CORS_ORIGIN: http://127.0.0.1:3000
      ENABLE_FIXTURE_HELPERS: "true"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  vulnerable-api-fixed:
    build:
      context: ./vulnerable-api
      dockerfile: Dockerfile
    container_name: apishield-vulnerable-api-fixed
    ports:
      - "127.0.0.1:5002:5001"
    environment:
      PORT: 5001
      BIND_HOST: 0.0.0.0
      NODE_ENV: development
      APP_MODE: fixed
      MONGO_URI: mongodb://mongo:27017/vulnerable-api-fixed
      JWT_SECRET: lab-only-not-a-real-secret
      JWT_EXPIRES_IN: 24h
      LOG_FILE: logs/http-events-fixed.jsonl
      CORS_ORIGIN: http://127.0.0.1:3000
      ENABLE_FIXTURE_HELPERS: "true"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  apishield_mongo_data:
